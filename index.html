<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Contact car owner</title>
<style>
:root{--y:#ffcc00;--ink:#16181b;--mut:#5d5f63;--line:#dedbd2;--bg:#f6f4ee;--card:#fff;--red:#e5372d;--grn:#1f9d55}
@media(prefers-color-scheme:dark){:root{--ink:#f1efe8;--mut:#a4a6ab;--line:#3a3d42;--bg:#16181b;--card:#202327}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif}
.wrap{max-width:460px;margin:0 auto;min-height:100vh;background:var(--card);display:flex;flex-direction:column}
header{background:var(--y);color:#1b1a12;padding:18px 20px 18px;position:relative}
header h1{margin:0;font-size:22px;line-height:1.25;padding-right:84px}
.lang{position:absolute;top:14px;right:14px;min-height:36px;padding:0 12px;border:1.5px solid #1b1a12;border-radius:999px;background:transparent;color:#1b1a12;font-size:14px;font-weight:600;cursor:pointer}
.plate{display:inline-block;margin-top:12px;background:#fff;color:#111;border:2px solid #111;border-radius:6px;padding:2px 12px;font-weight:800;font-size:20px;letter-spacing:.06em}
header p{margin:8px 0 0;font-size:14px}
main{padding:18px 20px 24px;display:flex;flex-direction:column;gap:14px;flex:1}
h2{font-size:17px;margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{min-height:52px;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:12px;font-size:14px;padding:8px 10px;text-align:left;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--ink);background:rgba(255,204,0,.25)}
.chip.sos{border-color:var(--red);color:var(--red)}
.chip.sos[aria-pressed=true]{background:rgba(229,55,45,.15)}
label{font-size:14px;font-weight:600;display:block;margin-bottom:4px}
.hint{font-weight:400;color:var(--mut)}
input,textarea{width:100%;font:16px inherit;font-family:inherit;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.send{min-height:54px;border:0;border-radius:14px;background:var(--ink);color:var(--card);font-size:17px;font-weight:700;cursor:pointer}
.send:disabled{opacity:.5}
.ghost{min-height:48px;border:1.5px dashed var(--line);border-radius:12px;background:transparent;color:var(--ink);font-size:15px;font-weight:600;cursor:pointer;width:100%;text-align:left;padding:0 14px}
.ghost.ok{border-style:solid;border-color:var(--grn);color:var(--grn)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.thumb{display:flex;align-items:center;gap:10px;margin-top:8px}
.thumb img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.thumb button{border:0;background:transparent;color:var(--red);font-size:14px;cursor:pointer;min-height:44px}
.err{color:var(--red);font-size:14px;min-height:20px;margin:0}
.ok-box{text-align:center;padding:24px 10px 6px}
.ok-box .tick{width:84px;height:84px;border-radius:50%;background:var(--grn);color:#fff;font-size:44px;display:grid;place-items:center;margin:0 auto 14px}
.small{font-size:13px;color:var(--mut)}
.banner{background:rgba(31,157,85,.14);color:var(--grn);border:1.5px solid var(--grn);border-radius:12px;padding:10px 12px;font-weight:600;font-size:15px}
footer{font-size:12px;color:var(--mut);text-align:center;padding:12px;border-top:1px solid var(--line)}
.msgs{display:flex;flex-direction:column;gap:6px;max-height:280px;min-height:90px;overflow-y:auto;padding:10px;border:1.5px solid var(--line);border-radius:12px}
.b{max-width:80%;padding:8px 12px;border-radius:14px;font-size:15px;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere}
.b.me{align-self:flex-end;background:var(--y);color:#1b1a12;border-bottom-right-radius:4px}
.b.them{align-self:flex-start;background:rgba(127,127,127,.16);border-bottom-left-radius:4px}
.b small{display:block;font-size:11px;opacity:.65;margin-top:2px}
.chatrow{display:flex;gap:8px}.chatrow input{flex:1;min-width:0}
.chatrow .send{min-height:48px;padding:0 18px;font-size:16px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="lang" id="lang" type="button">हिंदी</button>
    <h1 data-t="h1"></h1>
    <div class="plate" id="plate"></div>
    <p data-t="sub"></p>
  </header>

  <main id="form">
    <h2 data-t="issue"></h2>
    <div class="grid" id="reasons"></div>

    <div>
      <label for="msg"><span data-t="msgL"></span> <span class="hint" data-t="opt"></span></label>
      <textarea id="msg" rows="3" maxlength="300" data-ph="msgPh"></textarea>
    </div>

    <div class="row2">
      <button class="ghost" id="locBtn" type="button" data-t="locAdd"></button>
      <button class="ghost" id="photoBtn" type="button" data-t="photoAdd"></button>
    </div>
    <input id="photo" type="file" accept="image/*" hidden>
    <div class="thumb" id="thumb" hidden><img id="thumbImg" alt=""><button id="photoDel" type="button" data-t="remove"></button></div>
    <div id="landmarkBox" hidden>
      <label for="landmark" data-t="lmL"></label>
      <input id="landmark" maxlength="120" data-ph="lmPh">
    </div>

    <div>
      <label for="phone"><span data-t="phoneL"></span> <span class="hint" data-t="phoneH"></span></label>
      <input id="phone" inputmode="tel" pattern="[0-9]{10}" autocomplete="tel" data-ph="phonePh">
    </div>

    <p class="err" id="err" role="alert"></p>
    <button class="send" id="send" data-t="send"></button>
    <p class="small" data-t="note112" data-html="1"></p>
  </main>

  <main id="done" hidden>
    <div class="ok-box">
      <div class="tick">✓</div>
      <h2 data-t="doneT"></h2>
      <p class="small" id="doneText" data-t="doneP"></p>
      <p class="small" id="photoStatus"></p>
    </div>
    <div class="banner" id="resolved" hidden data-t="resolved"></div>
    <div id="cb">
      <label for="cbPhone"><span data-t="cbL"></span> <span class="hint" data-t="opt"></span></label>
      <input id="cbPhone" inputmode="tel" pattern="[0-9]{10}" autocomplete="tel" data-ph="cbPh">
      <p class="err" id="cbErr" role="alert"></p>
      <button class="send" id="cbSend" style="width:100%" data-t="cbBtn"></button>
    </div>
    <p class="small" id="cbDone" hidden style="text-align:center" data-t="cbDone"></p>
    <div id="chat">
      <h2 data-t="chatH"></h2>
      <div class="msgs" id="msgs" aria-live="polite"><p class="small" id="chatEmpty" data-t="connecting"></p></div>
      <div class="chatrow">
        <input id="chatIn" maxlength="300" autocomplete="off" data-ph="chatPh">
        <button class="send" id="chatSend" data-t="chatSend"></button>
      </div>
      <p class="err" id="chatErr" role="alert"></p>
      <p class="small" data-t="chatNote"></p>
    </div>
  </main>

  <footer data-t="footer"></footer>
</div>

<script>
{
/* ====== EDIT THESE ====== */
const CONFIG = {
  plate: "BR 01 KM 5873",          // shown on the page
  topic: "car-35luj3cnlicc99",     // your secret ntfy topic: subscribe to this in the ntfy app
  server: "https://ntfy.sh",       // change only if ntfy.sh ever stops working for you
  site: "https://abhishekkr9304.github.io/car/",   // where reply.html lives
  cooldownSec: 60,                 // one alert per minute from the same phone
  ringEveryMin: 30                 // owner's phone rings at most once per 30 min per scanner (emergencies always ring)
};
/* ======================== */

const REASONS = [
  {t:"Blocking my car / gate",     hi:"मेरी गाड़ी / गेट रोक रखा है", e:"car", p:4},
  {t:"Headlights are on",          hi:"हेडलाइट चालू है",          e:"bulb", p:3},
  {t:"Window or door open",        hi:"खिड़की या दरवाज़ा खुला है",   e:"window", p:3},
  {t:"Getting towed / no parking", hi:"टो हो रही है / नो पार्किंग",  e:"warning", p:5},
  {t:"Alarm is ringing",           hi:"अलार्म बज रहा है",          e:"loudspeaker", p:4},
  {t:"Minor damage / scratch",     hi:"हल्का नुकसान / खरोंच",       e:"wrench", p:4},
  {t:"Something else",             hi:"कुछ और",                  e:"speech_balloon", p:3},
  {t:"Emergency / accident",       hi:"इमरजेंसी / दुर्घटना",         e:"rotating_light", p:5, sos:true}
];

const TXT = {
  en:{h1:"Need the owner of this car?", sub:"Send an alert. The owner's phone number stays private.", issue:"What's the issue?",
      msgL:"Message", opt:"(optional)", msgPh:"e.g. I'm in the white car behind you",
      locAdd:"📍 Add my location", locBusy:"📍 Getting location…", locOk:"✓ Location added", locNo:"📍 Location not shared",
      photoAdd:"📷 Add a photo", photoOk:"✓ Photo added", remove:"Remove",
      lmL:"Location not shared. Type the nearest landmark instead:", lmPh:"e.g. Near SBI ATM, Boring Road",
      phoneL:"Your mobile number", phoneH:"(optional, so the owner can call you back)", phonePh:"10-digit number",
      send:"Alert the owner", sending:"Sending…",
      note112:"In an emergency where someone may be hurt, call <strong>112</strong> first.",
      ePick:"Please choose what the issue is.", ePhone:"Please enter a valid 10-digit mobile number, or leave it empty.",
      eWait:"Alert already sent. You can send another in {s}s.", eNet:"Couldn't send right now. Check your internet and try again.",
      doneT:"Owner alerted", doneP:"They've got your message on their phone. Thanks for letting them know.",
      doneSos:"The owner has been alerted. If anyone is hurt or in danger, call 112 now.",
      photoSending:"Sending photo…", photoSent:"✓ Photo sent", photoFail:"The photo couldn't be sent.",
      resolved:"✓ The owner says the situation is handled. Thank you!",
      cbL:"Want the owner to call you?", cbPh:"Your 10-digit mobile number", cbBtn:"Share my number",
      cbErr:"Please enter a valid 10-digit mobile number.", cbDone:"✓ Number sent. The owner can call you back.", cbFail:"Couldn't send right now. Please try again.",
      chatH:"Chat with the owner", connecting:"Connecting…", chatEmpty:"No messages yet. Say hello to the owner.",
      chatPh:"Type a message", chatSend:"Send", chatErr:"Message not sent. Check your internet and try again.",
      chatNote:"Keep this page open to see the owner's replies. Neither of you sees the other's number.",
      owner:"Owner", you:"You", footer:"Private contact tag · No app or sign-up needed", langBtn:"हिंदी"},
  hi:{h1:"इस गाड़ी के मालिक से संपर्क करना है?", sub:"अलर्ट भेजें। मालिक का फ़ोन नंबर निजी रहेगा।", issue:"क्या समस्या है?",
      msgL:"संदेश", opt:"(वैकल्पिक)", msgPh:"जैसे: मैं आपके पीछे सफ़ेद गाड़ी में हूँ",
      locAdd:"📍 मेरी लोकेशन जोड़ें", locBusy:"📍 लोकेशन ली जा रही है…", locOk:"✓ लोकेशन जुड़ गई", locNo:"📍 लोकेशन नहीं मिली",
      photoAdd:"📷 फ़ोटो जोड़ें", photoOk:"✓ फ़ोटो जुड़ गई", remove:"हटाएँ",
      lmL:"लोकेशन नहीं मिली। पास की कोई पहचान वाली जगह लिखें:", lmPh:"जैसे: बोरिंग रोड, SBI ATM के पास",
      phoneL:"आपका मोबाइल नंबर", phoneH:"(वैकल्पिक, ताकि मालिक आपको कॉल कर सकें)", phonePh:"10 अंकों का नंबर",
      send:"मालिक को अलर्ट करें", sending:"भेजा जा रहा है…",
      note112:"अगर किसी को चोट लगी हो, तो पहले <strong>112</strong> पर कॉल करें।",
      ePick:"कृपया समस्या चुनें।", ePhone:"कृपया सही 10 अंकों का मोबाइल नंबर डालें, या खाली छोड़ दें।",
      eWait:"अलर्ट भेजा जा चुका है। {s} सेकंड बाद दोबारा भेज सकते हैं।", eNet:"अभी भेजा नहीं जा सका। इंटरनेट जाँचें और फिर कोशिश करें।",
      doneT:"मालिक को सूचना दे दी गई", doneP:"उन्हें आपका संदेश मिल गया है। बताने के लिए धन्यवाद।",
      doneSos:"मालिक को सूचना दे दी गई है। अगर किसी को चोट लगी है या खतरा है, तो अभी 112 पर कॉल करें।",
      photoSending:"फ़ोटो भेजी जा रही है…", photoSent:"✓ फ़ोटो भेज दी गई", photoFail:"फ़ोटो नहीं भेजी जा सकी।",
      resolved:"✓ मालिक ने बताया कि समस्या सुलझ गई है। धन्यवाद!",
      cbL:"क्या आप चाहते हैं कि मालिक आपको कॉल करें?", cbPh:"आपका 10 अंकों का मोबाइल नंबर", cbBtn:"मेरा नंबर भेजें",
      cbErr:"कृपया सही 10 अंकों का मोबाइल नंबर डालें।", cbDone:"✓ नंबर भेज दिया गया। मालिक आपको कॉल कर सकते हैं।", cbFail:"अभी भेजा नहीं जा सका। फिर कोशिश करें।",
      chatH:"मालिक से चैट करें", connecting:"कनेक्ट हो रहा है…", chatEmpty:"अभी कोई संदेश नहीं। मालिक को संदेश भेजें।",
      chatPh:"संदेश लिखें", chatSend:"भेजें", chatErr:"संदेश नहीं गया। इंटरनेट जाँचें और फिर कोशिश करें।",
      chatNote:"मालिक के जवाब देखने के लिए यह पेज खुला रखें। कोई भी एक-दूसरे का नंबर नहीं देख सकता।",
      owner:"मालिक", you:"आप", footer:"निजी संपर्क टैग · कोई ऐप या साइन-अप ज़रूरी नहीं", langBtn:"English"}
};

const $ = id => document.getElementById(id);
const store = { get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } }, set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} } };

/* ---------- language ---------- */
let lang = store.get('tagLang') || ((navigator.language||'').toLowerCase().startsWith('hi') ? 'hi' : 'en');
const T = k => TXT[lang][k] ?? TXT.en[k];
const locState = {k:'locAdd'}, photoState = {k:'photoAdd'};
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => { if(el.dataset.html) el.innerHTML = T(el.dataset.t); else el.textContent = T(el.dataset.t); });
  document.querySelectorAll('[data-ph]').forEach(el => el.placeholder = T(el.dataset.ph));
  $('lang').textContent = T('langBtn');
  $('locBtn').textContent = T(locState.k);
  $('photoBtn').textContent = T(photoState.k);
  if(picked && picked.sos && !$('done').hidden) $('doneText').textContent = T('doneSos');
  if(!es && $('chatEmpty')) $('chatEmpty').textContent = T('connecting');
  renderReasons();
}
$('lang').addEventListener('click', ()=>{ lang = lang === 'en' ? 'hi' : 'en'; store.set('tagLang', lang); applyLang(); });

/* ---------- chat id ---------- */
let chatId = null;
try{ chatId = sessionStorage.getItem('chatId') }catch(e){}
if(!chatId){
  chatId = Array.from(crypto.getRandomValues(new Uint8Array(12)), b => (b%36).toString(36)).join('');
  try{ sessionStorage.setItem('chatId', chatId) }catch(e){}
}
const chatTopic = 'carchat-' + chatId;
const replyUrl = CONFIG.site + 'reply.html#' + chatId;
async function post(obj){
  const r = await fetch(CONFIG.server + '/', {method:'POST', body: JSON.stringify(obj)});
  if(!r.ok) throw new Error(r.status);
}

/* ---------- reasons ---------- */
$('plate').textContent = CONFIG.plate;
let picked = null;
function renderReasons(){
  $('reasons').innerHTML = REASONS.map((r,i)=>
    `<button class="chip${r.sos?' sos':''}" data-i="${i}" aria-pressed="${picked===r}">${lang==='hi'?r.hi:r.t}</button>`).join('');
}
$('reasons').addEventListener('click', ev=>{
  const b = ev.target.closest('.chip'); if(!b) return;
  picked = REASONS[b.dataset.i];
  document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed', c===b));
  if(picked.sos && !loc && !locPromise) getLocation();
});

/* ---------- location ---------- */
let loc = null, locPromise = null;
function setLoc(k, ok){ locState.k = k; $('locBtn').textContent = T(k); $('locBtn').classList.toggle('ok', !!ok); }
function getLocation(){
  if(!navigator.geolocation){ setLoc('locNo'); $('landmarkBox').hidden = false; return Promise.resolve(null); }
  setLoc('locBusy');
  locPromise = new Promise(res => navigator.geolocation.getCurrentPosition(
    p => { loc = {lat:p.coords.latitude.toFixed(5), lon:p.coords.longitude.toFixed(5), acc:Math.round(p.coords.accuracy)}; setLoc('locOk', true); $('landmarkBox').hidden = true; res(loc); },
    () => { loc = null; setLoc('locNo'); $('landmarkBox').hidden = false; res(null); },
    {enableHighAccuracy:true, timeout:10000, maximumAge:60000}));
  locPromise.finally(()=>{ locPromise = null; });
  return locPromise;
}
$('locBtn').addEventListener('click', ()=>{ if(!loc) getLocation(); });
const mapUrl = l => `https://maps.google.com/?q=${l.lat},${l.lon}`;

/* ---------- photo ---------- */
let photoBlob = null;
$('photoBtn').addEventListener('click', ()=> $('photo').click());
$('photo').addEventListener('change', async ()=>{
  const f = $('photo').files[0]; if(!f) return;
  try{
    const img = await new Promise((res, rej)=>{ const i = new Image(); i.onload = ()=>res(i); i.onerror = rej; i.src = URL.createObjectURL(f); });
    const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    photoBlob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.8));
    $('thumbImg').src = URL.createObjectURL(photoBlob); $('thumb').hidden = false;
    photoState.k = 'photoOk'; $('photoBtn').textContent = T('photoOk'); $('photoBtn').classList.add('ok');
  }catch(e){ photoBlob = null; }
});
$('photoDel').addEventListener('click', ()=>{
  photoBlob = null; $('photo').value = ''; $('thumb').hidden = true;
  photoState.k = 'photoAdd'; $('photoBtn').textContent = T('photoAdd'); $('photoBtn').classList.remove('ok');
});
async function sendPhoto(){
  if(!photoBlob) return;
  $('photoStatus').textContent = T('photoSending');
  try{
    const q = new URLSearchParams({filename:'photo.jpg', title:'Photo - ' + CONFIG.plate, tags:'camera',
      message:'Photo from the person who scanned your car (' + picked.t + ')'});
    const r = await fetch(`${CONFIG.server}/${CONFIG.topic}?${q}`, {method:'POST', body: new Blob([await photoBlob.arrayBuffer()])});
    if(!r.ok) throw new Error(r.status);
    $('photoStatus').textContent = T('photoSent');
  }catch(e){ $('photoStatus').textContent = T('photoFail'); }
}

/* ---------- send alert ---------- */
const lastSent = () => +store.get('tagSent') || 0;
const lastRang = () => +store.get('tagRang') || 0;

$('send').addEventListener('click', async ()=>{
  const err = $('err'); err.textContent = '';
  const msg = $('msg').value.trim();
  const phone = $('phone').value;
  if(!picked){ err.textContent = T('ePick'); return; }
  if(phone && !/^[6-9]\d{9}$/.test(phone)){ err.textContent = T('ePhone'); return; }
  const wait = CONFIG.cooldownSec*1000 - (Date.now()-lastSent());
  if(wait > 0){ err.textContent = T('eWait').replace('{s}', Math.ceil(wait/1000)); return; }

  const btn = $('send'); btn.disabled = true; btn.textContent = T('sending');
  if(locPromise) await locPromise;
  const landmark = $('landmark').value.trim();

  const lines = [];
  if(msg) lines.push(`"${msg}"`);
  if(loc) lines.push(`Location: ${mapUrl(loc)} (±${loc.acc} m)`);
  else if(landmark) lines.push(`Landmark: ${landmark}`);
  lines.push(phone ? `Scanner's number: +91 ${phone}` : 'Scanner did not share a number.');
  if(photoBlob) lines.push('Photo: coming in the next notification');
  lines.push(`Sent ${new Date().toLocaleString('en-IN',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'})}`);

  // "New alert" titles make the owner's phone ring (via iPhone automation); "Follow-up" titles don't
  const ring = picked.sos || (Date.now() - lastRang()) > CONFIG.ringEveryMin*60000;
  const body = {
    topic: CONFIG.topic,
    title: (ring ? 'New alert · ' : 'Follow-up · ') + (picked.sos ? 'URGENT: ' : '') + picked.t + ' · ' + CONFIG.plate,
    message: lines.join('\n'),
    tags: [picked.e],
    priority: picked.p,
    actions: [{action:'view', label:'Reply', url:replyUrl}]
  };
  if(loc) body.actions.push({action:'view', label:'Open map', url:mapUrl(loc)});
  if(phone) body.actions.push({action:'view', label:'Call back', url:'tel:+91'+phone, clear:true});

  try{
    await post(body);
    store.set('tagSent', Date.now());
    if(ring) store.set('tagRang', Date.now());
    $('form').hidden = true; $('done').hidden = false; window.scrollTo(0,0);
    if(phone) $('cb').hidden = true;
    if(picked.sos) $('doneText').textContent = T('doneSos');
    startChat();
    post({topic: chatTopic, title: 'scanner', message: picked.t + (msg ? ': ' + msg : '')}).catch(()=>{});
    sendPhoto();
  }catch(e){
    err.textContent = T('eNet');
  }finally{
    btn.disabled = false; btn.textContent = T('send');
  }
});

/* ---------- phone fields: exactly 10 digits ---------- */
['phone','cbPhone'].forEach(id=>$(id).addEventListener('input',ev=>{let d=ev.target.value.replace(/\D/g,'');if(d.length>10&&d.startsWith('91'))d=d.slice(2);else if(d.length>10&&d.startsWith('0'))d=d.slice(1);ev.target.value=d.slice(0,10)}));

/* ---------- share number later ---------- */
$('cbSend').addEventListener('click', async ()=>{
  const e = $('cbErr'); e.textContent = '';
  const p = $('cbPhone').value;
  if(!/^[6-9]\d{9}$/.test(p)){ e.textContent = T('cbErr'); return; }
  const b = $('cbSend'); b.disabled = true; b.textContent = T('sending');
  try{
    await post({topic: CONFIG.topic, title: 'Call back request · ' + CONFIG.plate,
      message: `Scanner's number: +91 ${p}` + (picked ? `\nAbout: ${picked.t}` : ''),
      tags: ['telephone_receiver'], priority: 4,
      actions: [{action:'view', label:'Reply', url:replyUrl}, {action:'view', label:'Call back', url:'tel:+91'+p, clear:true}]});
    $('cb').hidden = true; $('cbDone').hidden = false;
  }catch(x){
    e.textContent = T('cbFail'); b.disabled = false; b.textContent = T('cbBtn');
  }
});

/* ---------- chat ---------- */
let es = null;
function bubble(m){
  const e = $('chatEmpty'); if(e) e.remove();
  if((m.tags||[]).includes('resolved')) $('resolved').hidden = false;
  const d = document.createElement('div');
  d.className = 'b ' + (m.title === 'owner' ? 'them' : 'me');
  d.textContent = m.message;
  const t = document.createElement('small');
  t.textContent = (m.title === 'owner' ? T('owner') : T('you')) + ' · ' + new Date(m.time*1000).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  d.appendChild(t);
  $('msgs').appendChild(d); $('msgs').scrollTop = $('msgs').scrollHeight;
}
function startChat(){
  if(es) return;
  es = new EventSource(CONFIG.server + '/' + chatTopic + '/sse?since=all');
  es.onopen = ()=>{ const e = $('chatEmpty'); if(e) e.textContent = T('chatEmpty'); };
  es.onmessage = ev => { try{ const m = JSON.parse(ev.data); if(m.event === 'message') bubble(m); }catch(x){} };
}
async function sendChat(){
  const t = $('chatIn').value.trim(); if(!t) return;
  const b = $('chatSend'); b.disabled = true; $('chatErr').textContent = '';
  try{
    await post({topic: chatTopic, title: 'scanner', message: t});
    await post({topic: CONFIG.topic, title: 'Chat · ' + CONFIG.plate, message: t, tags: ['speech_balloon'], priority: 3,
                actions: [{action:'view', label:'Reply', url: replyUrl}]});
    $('chatIn').value = '';
  }catch(x){ $('chatErr').textContent = T('chatErr'); }
  finally{ b.disabled = false; }
}
$('chatSend').addEventListener('click', sendChat);
$('chatIn').addEventListener('keydown', e => { if(e.key === 'Enter') sendChat(); });

applyLang();
}
</script>
</body>
