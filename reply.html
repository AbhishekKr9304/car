<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Reply to scanner</title>
<style>
:root{--y:#ffcc00;--ink:#16181b;--mut:#5d5f63;--line:#dedbd2;--bg:#f6f4ee;--card:#fff;--red:#e5372d}
@media(prefers-color-scheme:dark){:root{--ink:#f1efe8;--mut:#a4a6ab;--line:#3a3d42;--bg:#16181b;--card:#202327}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:460px;margin:0 auto;height:100dvh;background:var(--card);display:flex;flex-direction:column}
header{background:var(--y);color:#1b1a12;padding:16px 20px}
header h1{margin:0;font-size:19px}
header p{margin:2px 0 0;font-size:13px}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:14px 16px}
.b{max-width:80%;padding:8px 12px;border-radius:14px;font-size:15px;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere}
.b.me{align-self:flex-end;background:var(--y);color:#1b1a12;border-bottom-right-radius:4px}
.b.them{align-self:flex-start;background:rgba(127,127,127,.16);border-bottom-left-radius:4px}
.b small{display:block;font-size:11px;opacity:.65;margin-top:2px}
.note{color:var(--mut);font-size:14px;text-align:center;margin:auto 0}
.quick{display:flex;gap:6px;overflow-x:auto;padding:8px 16px 0}
.quick button{flex:none;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:8px 12px;font-size:14px;cursor:pointer}
.row{display:flex;gap:8px;padding:10px 16px calc(12px + env(safe-area-inset-bottom))}
input{flex:1;min-width:0;font:16px inherit;font-family:inherit;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--ink)}
.send{min-height:48px;padding:0 18px;border:0;border-radius:12px;background:var(--ink);color:var(--card);font-size:16px;font-weight:700;cursor:pointer}
.send:disabled{opacity:.5}
.err{color:var(--red);font-size:13px;margin:0;padding:0 16px;min-height:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--y);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Chat with the person at your car</h1>
    <p>They can't see your number. Messages last about 12 hours.</p>
  </header>
  <div class="msgs" id="msgs" aria-live="polite"><p class="note" id="note">Connecting…</p></div>
  <div class="quick" id="quick"></div>
  <p class="err" id="err" role="alert"></p>
  <div class="row">
    <input id="inp" maxlength="300" placeholder="Type your reply" autocomplete="off">
    <button class="send" id="send">Send</button>
  </div>
</div>
<script>
{
const SERVER = "https://ntfy.sh";
const QUICK = ["Coming in 2 minutes", "On my way", "Moving it now, sorry!", "Thanks for letting me know", "Please wait 5 minutes"];
const $ = id => document.getElementById(id);
const id = location.hash.slice(1).replace(/[^a-z0-9]/gi, '');

if(!id){
  $('note').textContent = 'Open this page from the Reply button in your ntfy alert.';
  $('send').disabled = true; $('inp').disabled = true;
} else {
  const topic = 'carchat-' + id;
  const bubble = m => {
    const n = $('note'); if(n) n.remove();
    const d = document.createElement('div');
    d.className = 'b ' + (m.title === 'owner' ? 'me' : 'them');
    d.textContent = m.message;
    const t = document.createElement('small');
    t.textContent = (m.title === 'owner' ? 'You · ' : 'Them · ') + new Date(m.time*1000).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
    d.appendChild(t);
    $('msgs').appendChild(d); $('msgs').scrollTop = $('msgs').scrollHeight;
  };
  const es = new EventSource(SERVER + '/' + topic + '/sse?since=all');
  es.onopen = () => { const n = $('note'); if(n) n.textContent = 'No messages yet.'; };
  es.onmessage = ev => { try{ const m = JSON.parse(ev.data); if(m.event === 'message') bubble(m); }catch(x){} };

  const send = async text => {
    text = (text ?? $('inp').value).trim(); if(!text) return;
    $('send').disabled = true; $('err').textContent = '';
    try{
      const r = await fetch(SERVER + '/', {method:'POST', body: JSON.stringify({topic, title:'owner', message:text})});
      if(!r.ok) throw new Error(r.status);
      $('inp').value = '';
    }catch(x){ $('err').textContent = 'Not sent. Check your internet and try again.'; }
    finally{ $('send').disabled = false; }
  };
  $('quick').innerHTML = QUICK.map((q,i) => `<button data-i="${i}">${q}</button>`).join('');
  $('quick').addEventListener('click', e => { const b = e.target.closest('button'); if(b) send(QUICK[b.dataset.i]); });
  $('send').addEventListener('click', () => send());
  $('inp').addEventListener('keydown', e => { if(e.key === 'Enter') send(); });
}
}
</script>
</body>
</html>
